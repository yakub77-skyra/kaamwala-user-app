name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  flutter:
    name: Analyze & Test (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kaamwala
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

  functions:
    name: Type-check Edge Functions (Deno)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kaamwala/supabase/functions
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check all function sources
        run: deno check */index.ts
